<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Allows native mobile pinch-to-zoom without restrictions -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avinash Agarwal CV</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #1e1e1e;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 0;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .toolbar {
      margin-bottom: 16px;
    }
    .download-btn {
      background: #2563eb;
      color: #fff;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: 500;
      font-size: 14px;
      display: inline-block;
    }
    .download-btn:hover {
      background: #1d4ed8;
    }
    #pdf-viewer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 100%;
      padding: 0 12px;
    }
    canvas {
      /* Display size fits the mobile screen nicely */
      width: 100%;
      max-width: 850px;
      height: auto;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      background: #fff;
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <a href="Avinash_Agarwal_CV.pdf" download class="download-btn">Download CV (PDF)</a>
  </div>

  <div id="pdf-viewer"></div>

  <script>
    const url = 'Avinash_Agarwal_CV.pdf';
    pdfjsLib.GlobalWorkerOptions.workerSrc = 
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    pdfjsLib.getDocument(url).promise.then(pdf => {
      const viewer = document.getElementById('pdf-viewer');

      for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        pdf.getPage(pageNum).then(page => {
          // Render at high resolution (min 2x) for razor-sharp pinch-to-zoom
          const renderScale = Math.max(window.devicePixelRatio || 1, 2);
          const viewport = page.getViewport({ scale: renderScale });

          const canvas = document.createElement('canvas');
          const context = canvas.getContext('2d');

          // High internal resolution
          canvas.height = viewport.height;
          canvas.width = viewport.width;

          viewer.appendChild(canvas);

          page.render({
            canvasContext: context,
            viewport: viewport
          });
        });
      }
    });
  </script>
</body>
</html>
